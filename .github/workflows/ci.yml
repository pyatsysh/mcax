name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Fast suite
        # The slow marker holds the full EOS validation, which needs minutes
        # per case; it is a release gate, not a per-push one.
        #
        # One process per test FILE. Every state point is its own XLA
        # compilation (`spec` is a static jit argument, deliberately), JAX keeps
        # every executable alive for the life of the process, and past some
        # number of them the process aborts inside the compiler rather than
        # failing a test — taking the run down mid-file and reporting whatever
        # was already degrading as failures. Measured at fourteen of them, all
        # passing when re-run per file. `tests/conftest.py` clears the cache
        # between modules as well; this is the guarantee, not the optimisation.
        env:
          JAX_PLATFORMS: cpu
        run: scripts/run_tests.sh -m "not slow" -q

  validate:
    # Full physics validation against Tonks / Henderson / Carnahan-Starling.
    # Manual and release-only: tens of minutes on CPU runners.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - env:
          JAX_PLATFORMS: cpu
        run: scripts/run_tests.sh -m slow -q
